<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset Password — DK Enterprise Kudlu New Franchise</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div id="site-header"></div>

<section class="wrap" style="padding-top:60px;padding-bottom:80px;display:flex;justify-content:center;">
  <div class="card" style="max-width:400px;width:100%;">
    <h2>Reset Password</h2>
    <p style="color:var(--grey);font-size:14px;margin-top:-6px;" id="subtitle">Choose a new password for your account.</p>

    <div id="form-fields">
      <div class="field">
        <label for="password">New Password</label>
        <input type="password" id="password" autocomplete="new-password">
      </div>
      <div class="field">
        <label for="confirm">Confirm Password</label>
        <input type="password" id="confirm" autocomplete="new-password">
      </div>
      <button class="btn amber block" id="reset-btn">Reset Password</button>
    </div>
    <div id="msg"></div>
    <p style="text-align:center;font-size:14px;margin-top:18px;"><a href="/login.html">← Back to login</a></p>
  </div>
</section>

<div id="site-footer"></div>
<script src="/js/api.js"></script>
<script src="/js/chrome.js?v=29"></script>
<script>
const params = new URLSearchParams(window.location.search);
const token = params.get('token');
const email = params.get('email');

if (!token || !email) {
  document.getElementById('form-fields').style.display = 'none';
  document.getElementById('subtitle').textContent = 'This reset link is missing information.';
  document.getElementById('msg').innerHTML = '<div class="msg err">Request a new reset link from the forgot password page.</div>';
}

document.getElementById('reset-btn')?.addEventListener('click', async () => {
  const password = document.getElementById('password').value;
  const confirm = document.getElementById('confirm').value;
  const msgEl = document.getElementById('msg');
  const btn = document.getElementById('reset-btn');
  msgEl.innerHTML = '';
  if (!password || password.length < 6) { msgEl.innerHTML = '<div class="msg err">Password should be at least 6 characters.</div>'; return; }
  if (password !== confirm) { msgEl.innerHTML = '<div class="msg err">Passwords do not match.</div>'; return; }

  btn.disabled = true; btn.textContent = 'Resetting…';
  try {
    const data = await API.request('/auth/reset-password', { method: 'POST', body: { email, token, password }, auth: false });
    document.getElementById('form-fields').style.display = 'none';
    msgEl.innerHTML = `<div class="msg ok">${escapeHtml(data.message)} <a href="/login.html">Log in →</a></div>`;
  } catch (err) {
    msgEl.innerHTML = `<div class="msg err">${escapeHtml(err.message)}</div>`;
    btn.disabled = false; btn.textContent = 'Reset Password';
  }
});
</script>
</body>
</html>
