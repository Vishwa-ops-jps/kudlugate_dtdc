<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Forgot Password — DTDC Kudlu Gate</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div id="site-header"></div>

<section class="wrap" style="padding-top:60px;padding-bottom:80px;display:flex;justify-content:center;">
  <div class="card" style="max-width:400px;width:100%;">
    <h2>Forgot Password</h2>
    <p style="color:var(--grey);font-size:14px;margin-top:-6px;">Enter your account email and we'll send you a reset link. Works for customer, staff and admin logins.</p>

    <div class="field">
      <label for="email">Email</label>
      <input type="email" id="email" autocomplete="username">
    </div>
    <button class="btn amber block" id="send-btn">Send Reset Link</button>
    <div id="msg"></div>
    <p style="text-align:center;font-size:14px;margin-top:18px;"><a href="/login.html">← Back to login</a></p>
  </div>
</section>

<div id="site-footer"></div>
<script src="/js/api.js"></script>
<script src="/js/chrome.js?v=29"></script>
<script>
document.getElementById('send-btn').addEventListener('click', async () => {
  const email = document.getElementById('email').value.trim();
  const msgEl = document.getElementById('msg');
  const btn = document.getElementById('send-btn');
  msgEl.innerHTML = '';
  if (!email) { msgEl.innerHTML = '<div class="msg err">Enter your email.</div>'; return; }
  btn.disabled = true; btn.textContent = 'Sending…';
  try {
    const data = await API.request('/auth/forgot-password', { method: 'POST', body: { email }, auth: false });
    msgEl.innerHTML = `<div class="msg ok">${escapeHtml(data.message)}</div>`;
  } catch (err) {
    msgEl.innerHTML = `<div class="msg err">${escapeHtml(err.message)}</div>`;
  } finally {
    btn.disabled = false; btn.textContent = 'Send Reset Link';
  }
});
document.getElementById('email').addEventListener('keydown', (e) => { if (e.key === 'Enter') document.getElementById('send-btn').click(); });
</script>
</body>
</html>
