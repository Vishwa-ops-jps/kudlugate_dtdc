<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Staff Login — DK Enterprise Kudlu New Franchise</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<nav class="site-nav">
  <div class="wrap">
    <a href="/" class="brand">
      <span class="brand-mark">DK</span>
      <span class="brand-text">DK Enterprise Kudlu New Franchise<small>Staff Panel</small></span>
    </a>
    <div class="nav-links" style="display:flex;">
      <a href="/">← Back to site</a>
    </div>
  </div>
</nav>

<section class="wrap" style="padding-top:60px;padding-bottom:80px;display:flex;justify-content:center;">
  <div class="card" style="max-width:400px;width:100%;">
    <h2>Staff / Admin Log In</h2>
    <p style="color:var(--grey);font-size:14px;margin-top:-6px;">For branch staff and franchise administrators.</p>
    <div class="field">
      <label for="email">Email</label>
      <input type="email" id="email" autocomplete="username">
    </div>
    <div class="field">
      <label for="password">Password</label>
      <input type="password" id="password" autocomplete="current-password">
    </div>
    <button class="btn amber block" id="login-btn">Log In</button>
    <div id="msg"></div>
    <p style="text-align:center;font-size:13px;margin-top:14px;"><a href="/forgot-password.html">Forgot password?</a></p>
  </div>
</section>

<script src="/js/api.js"></script>
<script>
(function checkLoggedIn() {
  const current = Session.getUser();
  if (current) {
    const msgEl = document.getElementById('msg');
    if (msgEl) {
      msgEl.innerHTML = `<div class="msg ok" style="margin-top:10px;">
        Logged in as <strong>${escapeHtml(current.name || current.email)}</strong> (${current.role}).<br>
        <a href="${current.role === 'customer' ? '/dashboard.html' : '/admin/dashboard.html'}" style="font-weight:600;text-decoration:underline;">Go to Dashboard →</a> &nbsp;|&nbsp;
        <a href="#" id="switch-acc-link" style="font-weight:600;text-decoration:underline;color:var(--red);">Log Out to Switch Account</a>
      </div>`;
      const link = document.getElementById('switch-acc-link');
      if (link) link.addEventListener('click', (e) => { e.preventDefault(); Session.clear(); window.location.reload(); });
    }
  }
})();

document.getElementById('login-btn').addEventListener('click', async () => {
  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;
  const msgEl = document.getElementById('msg');
  msgEl.innerHTML = '';
  if (!email || !password) { msgEl.innerHTML = '<div class="msg err">Enter email and password.</div>'; return; }
  try {
    const { token, user } = await API.request('/auth/login', { method: 'POST', body: { email, password }, auth: false });
    Session.set(token, user);
    if (user.role === 'customer') {
      window.location.href = '/dashboard.html';
    } else {
      window.location.href = '/admin/dashboard.html';
    }
  } catch (err) {
    msgEl.innerHTML = `<div class="msg err">${escapeHtml(err.message)}</div>`;
  }
});
document.getElementById('password').addEventListener('keydown', (e) => { if (e.key === 'Enter') document.getElementById('login-btn').click(); });
</script>
</body>
</html>
